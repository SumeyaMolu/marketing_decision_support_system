
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ report.report_title }} | Marketing DSS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .report {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #1f2937;
            margin-bottom: 12px;
        }

        .metadata {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .content {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 14px;
            color: #374151;
            border-top: 1px solid #e5e7eb;
            padding-top: 25px;
        }

        .actions {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            margin-right: 10px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #6b7280;
        }

        .secondary:hover {
            background: #4b5563;
        }

        @media print {
            body {
                background: white;
            }

            .container {
                margin: 0;
                max-width: 100%;
            }

            .report {
                box-shadow: none;
            }

            .actions {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="report">

            <h1>{{ report.report_title }}</h1>

            <div class="metadata">

                <p>
                    <strong>Campaign:</strong>
                    {{ report.campaign.campaign_name }}
                </p>

                <p>
                    <strong>Report Type:</strong>
                    {{ report.report_type or "Campaign Performance" }}
                </p>

                <p>
                    <strong>Generated:</strong>
                    {{ report.generated_at.strftime("%d %B %Y, %H:%M")
                       if report.generated_at else "Not available" }}
                </p>

            </div>

            <div class="content">{{ report.report_content }}</div>

            <div class="actions">

                <button class="button" onclick="window.print()">
                    Print / Save as PDF
                </button>

                <a class="button secondary"
                   href="{{ url_for('reports.reports_list') }}">
                    Back to Reports
                </a>

            </div>

        </div>

    </div>

</body>
</html>
